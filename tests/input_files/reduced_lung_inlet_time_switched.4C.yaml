TITLE:
  - "3 resistive airways forming a bifurcation, 2 terminal units with Kelvin-Voigt rheology, Ogden"
  - "elasticity and recruitment, volume-dependent pleural pressure at both outlets. The inlet switches"
  - "from a prescribed flow (inflation) to a prescribed pressure of 0 (release) and back to a"
  - "prescribed flow (low flow inflation)."
PROBLEM TYPE:
  PROBLEMTYPE: "Reduced_Lung"
reduced_dimensional_lung:
  air_properties:
    density: 1.176e-06
    dynamic_viscosity: 1.79105e-05
  dynamics:
    linear_solver: 1
    nonlinear_solver: NewtonTree
    number_of_steps: 60
    restart_every: 1
    results_every: 1
    time_increment: 0.05
  geometry:
    file: "vtu/reduced_lung_3_aw_2_tu.vtu"
  lung_tree:
    airways:
      element_blocks: [1]
      radius:
        from_mesh: "radius"
      flow_model:
        resistance_type:
          constant: Linear
        include_inertia:
          constant: false
      wall_model_type:
        constant: Rigid
    terminal_units:
      element_blocks: [2]
      v0:
        constant: 4.1887902047863905
      rheological_model:
        rheological_model_type:
          constant: KelvinVoigt
        kelvin_voigt:
          viscosity_kelvin_voigt_eta:
            constant: 1.0
      elasticity_model:
        elasticity_model_type:
          constant: Ogden
        ogden:
          ogden_parameter_kappa:
            constant: 1.0
          ogden_parameter_beta:
            constant: -6.0
      recruitment_model:
        pressure_law_type:
          constant: LinearPressure
        time_law_type:
          constant: ExponentialRelaxation
        reference_volume_linearization:
          constant: Frozen
        linear_pressure:
          v0_min:
            constant: 2.0
          v0_max:
            constant: 4.1887902047863905
          p_closing_min:
            constant: -0.1
          p_opening_min:
            constant: 0.8
          delta_p_minmax:
            constant: 0.4
          epsilon_v0_switch:
            constant: 0.05
          initial_path:
            constant: Closing
        exponential_relaxation:
          tau:
            constant: 0.4
  boundary_conditions:
    time_switched:
      - id: 1
        phases:
          - variable: Flow
            function_id: 1
            end_time: 1.0
          - variable: Pressure
            function_id: 2
            end_time: 2.0
          - variable: Flow
            function_id: 3
            end_time: 3.0
    volume_dependent_pleural_pressure:
      - id: 2
        residual_volume: 0.0
        total_lung_capacity: 16.0
        normalized_linear_exponential:
          pressure_offset:
            constant: -0.2
          linear_coefficient: 0.4
          exponential_coefficient: 0.25
          exponential_rate: 2.0
SOLVER 1:
  SOLVER: "UMFPACK"
  NAME: "Reduced_lung_solver"
FUNCT1:
  - SYMBOLIC_FUNCTION_OF_TIME: "2.0"
FUNCT2:
  - SYMBOLIC_FUNCTION_OF_TIME: "0.0"
FUNCT3:
  - SYMBOLIC_FUNCTION_OF_TIME: "0.5"
RESULT DESCRIPTION:
  # The last phase prescribes the inlet flow.
  - REDUCED_LUNG:
      ELEMENT: 1
      QUANTITY: "q_in"
      VALUE: 0.5
      TOLERANCE: 1e-10
  - REDUCED_LUNG:
      ELEMENT: 1
      QUANTITY: "p_in"
      VALUE: 0.3108726500235499
      TOLERANCE: 1e-8
  # The volumes depend on the outflow during the pressure phase, which the model determines.
  - REDUCED_LUNG:
      ELEMENT: 4
      QUANTITY: "volume"
      VALUE: 2.975852779122081
      TOLERANCE: 1e-8
  - REDUCED_LUNG:
      ELEMENT: 5
      QUANTITY: "volume"
      VALUE: 2.9758146104247234
      TOLERANCE: 1e-8
