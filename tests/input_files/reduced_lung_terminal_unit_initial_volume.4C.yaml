TITLE:
  - "1 terminal unit with Ogden material starting pre-stretched at its initial volume."
  - "The inlet pressure equals the elastic pressure at the initial volume, P = kappa/beta*y*(1-y^beta)"
  - "with y = v0/initial_volume, so the unit is in equilibrium: volume stays 5.0, flow stays 0."
PROBLEM TYPE:
  PROBLEMTYPE: "Reduced_Lung"
reduced_dimensional_lung:
  air_properties:
    density: 1.176e-06
    dynamic_viscosity: 1.79105e-05
  dynamics:
    linear_solver: 1
    number_of_steps: 3
    restart_every: 1
    results_every: 1
    time_increment: 0.1
  geometry:
    file: "vtu/reduced_lung_terminal_unit.vtu"
  lung_tree:
    airways: # These values won't be used since there are no airways in the model
      radius:
        constant: 1.0
      flow_model:
        resistance_type:
          constant: Linear
        include_inertia:
          constant: false
      wall_model_type:
        constant: Rigid
    terminal_units:
      element_blocks: [2]
      v0:
        constant: 4.1887902047863905
      initial_volume:
        constant: 5.0
      rheological_model:
        rheological_model_type:
          constant: KelvinVoigt
        kelvin_voigt:
          viscosity_kelvin_voigt_eta:
            constant: 1.0
      elasticity_model:
        elasticity_model_type:
          constant: Ogden
        ogden:
          ogden_parameter_kappa:
            constant: 1.0
          ogden_parameter_beta:
            constant: -6.0
  boundary_conditions:
    pressure:
      - id: 1
        function_id: 1
      - id: 2
        function_id: 2
SOLVER 1:
  SOLVER: "UMFPACK"
  NAME: "Reduced_lung_solver"
FUNCT1:
  - SYMBOLIC_FUNCTION_OF_TIME: "0.26425680053766476"
FUNCT2:
  - SYMBOLIC_FUNCTION_OF_TIME: "0"
RESULT DESCRIPTION:
  - REDUCED_LUNG:
      ELEMENT: 1
      QUANTITY: "volume"
      VALUE: 5.0
      TOLERANCE: 1e-10
  - REDUCED_LUNG:
      ELEMENT: 1
      QUANTITY: "q_in"
      VALUE: 0.0
      TOLERANCE: 1e-10
